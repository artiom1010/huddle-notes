version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # stay on Python 3.12 (what the code, pyproject and regression are built on); patches only
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
