[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "huddle-notes"
version = "0.1.0"
description = "Named transcripts and notes of Slack huddle recordings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "sherpa-onnx==2.0.1",
    "slack-sdk==3.46.0",
    "soundfile==0.14.0",
    "truststore==0.10.5",  # trust the certificates the system trusts (company networks re-sign TLS)
    "tzdata==2026.6; sys_platform == 'win32'",  # Windows has no time zone database of its own
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
huddle-notes = "huddle_notes.cli:main"

[tool.setuptools.packages.find]
include = ["huddle_notes*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Russian text is not a typo of Latin letters
    "S603", "S607",                # ffmpeg and whisper are run by name with argument lists, never a shell
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["huddle_notes"]

[[tool.mypy.overrides]]
module = ["sherpa_onnx", "soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
